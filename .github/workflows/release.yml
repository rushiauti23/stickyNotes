name: Release APK

# Runs when you publish a release on GitHub (Releases -> Draft a new release).
# Builds a small, signed release APK and attaches it to that release, so your phone
# downloads the .apk directly instead of a zip.
on:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    working-directory: StickyNotes

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to attach the APK to the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"

      - name: Read version from the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]{1,2})\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Tag must look like v1.4.1 (got '$TAG')."
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          echo "name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          gradle :app:assembleRelease -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE"
          rm -f release.jks keystore.properties
          cp app/build/outputs/apk/release/app-release.apk "sticky-notes-$VERSION_NAME.apk"
          ls -lh "sticky-notes-$VERSION_NAME.apk"

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: gh release upload "$TAG" "sticky-notes-$VERSION_NAME.apk" --repo "$GITHUB_REPOSITORY" --clobber
